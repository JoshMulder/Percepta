# Build the ground-station image, push it to GHCR (private), and sign it keyless
# with Sigstore so the host-side updater can verify provenance before running it
# (station/DECISIONS.md item 48). Triggered by a version tag.
#
# The signer is THIS workflow's own OIDC identity — no long-lived key to guard.
# That identity is what station/deploy/gsu-update.sh verifies against; the two
# must stay in lockstep:
#   identity: https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v*
#   issuer:   https://token.actions.githubusercontent.com
#
# NOT VERIFIED here (no way to run Actions from the dev machine). The action
# versions and the cosign flags are the standard ones; shake this out on the
# first real tag, and confirm the recorded signer identity matches the regexp in
# gsu-update.sh before pointing a station at the result.
name: Release station image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # keyless cosign signing via GitHub's OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/percepta-gsu" >> "$GITHUB_ENV"

      # arm64 (the Pi) is built under emulation alongside amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./station
          file: ./station/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            GSU_VERSION=${{ github.ref_name }}
          # The whisper.cpp compile plus ~600 MB of models is heavy, doubly so
          # across two arches — cache it between releases.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        # By digest — the immutable thing the box pulls and verifies. The signer
        # is this workflow's identity, which is what gsu-update.sh's
        # `cosign verify --certificate-identity-regexp` must match.
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
