<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="30" height="30">
  <g fill="#3b82f6" stroke="#0b1220" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- arms (X frame) -->
    <g stroke="#3b82f6" stroke-width="2.6">
      <line x1="16" y1="16" x2="7"  y2="7"/>
      <line x1="16" y1="16" x2="25" y2="7"/>
      <line x1="16" y1="16" x2="25" y2="25"/>
      <line x1="16" y1="16" x2="7"  y2="25"/>
    </g>
    <!-- propeller blades -->
    <g fill="#3b82f6" fill-opacity="0.55" stroke="none">
      <g transform="translate(7,7)">   <ellipse rx="4.8" ry="1.15" transform="rotate(35)"/><ellipse rx="4.8" ry="1.15" transform="rotate(-35)"/></g>
      <g transform="translate(25,7)">  <ellipse rx="4.8" ry="1.15" transform="rotate(35)"/><ellipse rx="4.8" ry="1.15" transform="rotate(-35)"/></g>
      <g transform="translate(25,25)"> <ellipse rx="4.8" ry="1.15" transform="rotate(35)"/><ellipse rx="4.8" ry="1.15" transform="rotate(-35)"/></g>
      <g transform="translate(7,25)">  <ellipse rx="4.8" ry="1.15" transform="rotate(35)"/><ellipse rx="4.8" ry="1.15" transform="rotate(-35)"/></g>
    </g>
    <!-- rotor guard rings -->
    <g fill="none" stroke="#3b82f6" stroke-width="1.3">
      <circle cx="7"  cy="7"  r="5"/>
      <circle cx="25" cy="7"  r="5"/>
      <circle cx="25" cy="25" r="5"/>
      <circle cx="7"  cy="25" r="5"/>
    </g>
    <!-- motor hubs -->
    <g stroke="none">
      <circle cx="7"  cy="7"  r="1.4"/>
      <circle cx="25" cy="7"  r="1.4"/>
      <circle cx="25" cy="25" r="1.4"/>
      <circle cx="7"  cy="25" r="1.4"/>
    </g>
    <!-- body -->
    <rect x="12" y="12.5" width="8" height="7" rx="2" stroke="none"/>
    <!-- heading marker (front = up) -->
    <path d="M16 9.4l2.1 3.2h-4.2z" stroke="none"/>
  </g>
</svg>
