# Pinned so volumes are found under a stable name even if the checkout
# directory is renamed - same reasoning as DroneOps.
name: percepta

services:
  postgres:
    image: postgres:17
    container_name: percepta-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately not published. Reach it through the app container, or
    # temporarily uncomment for local inspection.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: percepta-redis
    restart: unless-stopped
    # What Redis holds here is all reconstructible: control leases (a lost lease
    # is re-acquired), revocation pushes (the 60s revalidation poll is the
    # backstop), single-use stream ticket ids (they expire in 60s anyway) and
    # live fan-out. None of it survives a restart usefully, so persistence is off.
    # requirepass closes the `default` user. Without it any process that can
    # reach the port has the run of the broker, which makes the per-station ACL
    # users decorative - they bind whoever uses them and nobody who does not.
    #
    # ACL users themselves are deliberately NOT persisted: the platform rebuilds
    # every station principal from the credential hashes in Postgres at start-up
    # (services/broker_acl.sync_all), which is one source of truth instead of
    # two that can disagree.
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      # TLS only. `--port 0` disables the plaintext listener outright rather
      # than leaving it available beside the encrypted one: a station
      # misconfigured to redis:// would otherwise send its credential in clear
      # and appear to work perfectly, which is the worst kind of failure.
      #
      # Clients are not asked for certificates yet - they authenticate with
      # their per-station ACL password. mTLS is the documented upgrade
      # (contract/enrolment.md §3) and this changes only the credential type.
      - "--port"
      - "0"
      - "--tls-port"
      - "6379"
      - "--tls-cert-file"
      - "/certs/redis.crt"
      - "--tls-key-file"
      - "/certs/redis.key"
      - "--tls-ca-cert-file"
      - "/certs/ca.crt"
      - "--tls-auth-clients"
      - "no"
    volumes:
      - ./certs:/certs:ro
    ports:
      # Loopback only, and on 6380 rather than 6379 because a development host
      # often already runs its own Redis - connecting to the wrong one looks
      # exactly like a station publishing nothing, which is a bad hour.
      #
      # Bound to REDIS_BIND, which defaults to loopback. Set it to 0.0.0.0 to
      # let a ground station on the same network reach the broker - needed for a
      # real station, and safe only because requirepass is now set.
      #
      # TLS, so this is safe to expose. The station verifies the certificate
      # against the CA it was pinned at enrolment, which is stronger here than
      # public PKI: it trusts exactly one issuer rather than every CA on earth.
      - "${REDIS_BIND:-127.0.0.1}:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt",
             "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Development mail sink. Accepts anything on 1025 and shows it at 8025; no
  # message ever leaves the host, so a reset link in a test account's inbox
  # cannot reach the real address it is addressed to. It is also the only honest
  # way to see what these mails look like.
  #
  # Bound to loopback for both ports: the web inbox is unauthenticated and holds
  # live password-reset links. Do not run this in production - point SMTP_HOST
  # at a real relay and delete this service.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: percepta-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  app:
    build:
      # Root context: the image builds the console from web/ and the API from
      # app/ in one multi-stage build, so neither Node nor a toolchain is
      # needed on the host.
      context: .
      dockerfile: app/Dockerfile
    container_name: percepta-app
    restart: unless-stopped
    env_file:
      - .env
    command: python -m backend.scripts.start_app
    # The image runs as uid/gid 10001. The TLS private key is group-readable
    # by the host user that generated it rather than world-readable, so the
    # container is given that group as a supplementary one. The alternative is
    # chmod 644 on a private key, which is how keys end up in backups and
    # archives they should never have reached.
    group_add:
      - "${PERCEPTA_CERT_GID:-1000}"
    volumes:
      - ./certs:/certs:ro
      # Only the backend source, deliberately not ./app:/app. Mounting the whole
      # directory would shadow /app/static, which is built into the image by the
      # console stage and does not exist on the host - the console would 404 with
      # no obvious cause.
      - ./app/backend:/app/backend
      # Cached basemap tiles. A named volume, not a bind mount: this is
      # generated data, it can be large, and it must survive a rebuild - a
      # station's tiles are downloaded once and re-fetching them is both slow
      # and, depending on the provider, rate-limited.
      - tile_cache:/tiles
    ports:
      # In production bind to loopback and let a reverse proxy terminate TLS:
      #   "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
      - "${APP_BIND:-127.0.0.1}:${APP_HOST_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The private image registry for remote update — server/docs/07-remote-update-
  # distribution.md. registry:2, behind the same reverse proxy that fronts the
  # app: the proxy terminates TLS for the registry hostname and forwards here, so
  # like the app it binds loopback and is never exposed directly.
  #
  # Pull auth is the Docker token flow with THIS platform as the token server —
  # a station pulls with the bearer credential it already holds, the app's token
  # endpoint mints a short-lived pull-scoped JWT, and the registry verifies it
  # against the public half of the app's token key (the rootcertbundle below).
  # Push is a separate robot credential the release box holds.
  #
  # First piece: this stands up the registry. It is NOT functional until the
  # token endpoint (REALM) and its cert (rootcertbundle) exist — the next piece —
  # so `.49` is not redeployed with this until then. Blobs live on a named volume
  # so a rebuild never drops a published image (rollback targets, history), and
  # deletion is on so scheduled GC can reclaim digests past the last few kept.
  registry:
    image: registry:2
    container_name: percepta-registry
    restart: unless-stopped
    environment:
      # Storage is the image's default filesystem driver at /var/lib/registry
      # (the registry_data volume below). NOT set explicitly on purpose: an
      # explicit filesystem env here would collide with the S3 driver when the
      # r2 overlay is applied (registry:2 refuses two storage drivers), and the
      # image default is the same path. See docker-compose.r2.yaml.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: token
      # REALM is this platform's token endpoint; SERVICE and ISSUER must match
      # what that endpoint stamps into every JWT; the bundle is the public cert
      # of the app's token-signing key (placed in ./certs by the next piece).
      REGISTRY_AUTH_TOKEN_REALM: "${GSU_REGISTRY_TOKEN_REALM:-https://app.percepta.nz/v2/token}"
      REGISTRY_AUTH_TOKEN_SERVICE: "${GSU_REGISTRY_SERVICE:-registry.percepta.nz}"
      REGISTRY_AUTH_TOKEN_ISSUER: "${GSU_REGISTRY_ISSUER:-percepta-platform}"
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /certs/registry-token.crt
    volumes:
      - registry_data:/var/lib/registry
      - ./certs:/certs:ro
    ports:
      - "${REGISTRY_BIND:-127.0.0.1}:${REGISTRY_HOST_PORT:-5000}:5000"
    security_opt:
      - no-new-privileges:true

  # No station simulator here any more.
  #
  # Demo data is generated by the station build instead: every slot in
  # gsu/devices/registry.py offers a "Demo" sensor alongside the real ones, and
  # a station running one publishes `simulated: true` on that stream. The
  # generators were always on the station — this service was a second copy of
  # them, enrolling fake stations from the outside.
  #
  # Three things that cost us are gone with it. Demo is now per sensor, so a
  # bench box with a live camera and a demo weather head is describable, which
  # a station-wide flag could not do. Nothing has to be excluded by name from a
  # simulator that would otherwise adopt real stations. And what an operator
  # sees in a demo is produced by the same code path as real telemetry, so a
  # demo exercises the station rather than a parallel implementation of it.

  # Scheduled database backups. Same image as the database so pg_dump always
  # matches the server version - a newer server with an older pg_dump refuses
  # outright, and that is not a thing to discover during a restore.
  #
  # Kept on this host for now, which covers a bad migration and a dropped table
  # and does not cover the disk or the building. Moving them off-box is the
  # remaining half and needs a destination rather than more code.
  backup:
    image: postgres:17
    container_name: percepta-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_USER: "${POSTGRES_USER:-percepta}"
      POSTGRES_DB: "${POSTGRES_DB:-percepta}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-6}"
      BACKUP_KEEP: "${BACKUP_KEEP:-28}"
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup_loop.sh:/usr/local/bin/backup_loop.sh:ro
      - "${BACKUP_DIR:-./backups}:/backups"
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_loop.sh"]
    security_opt:
      - no-new-privileges:true

  # --- tests, and a database to throw away -------------------------------
  #
  # Both under the `tests` profile, so `docker compose up` never starts them
  # and a deployment never carries a second Postgres it did not ask for. Run
  # them with:
  #
  #     docker compose --profile tests run --rm tests
  #
  # The database has no volume behind it on purpose. A suite that shares a
  # database with a running stack either corrupts it or is too careful to
  # write, and both are worse than starting from nothing every time. It is also
  # why the tests may TRUNCATE freely between cases.
  postgres-test:
    image: postgres:17
    profiles: ["tests"]
    environment:
      POSTGRES_USER: percepta
      POSTGRES_PASSWORD: test
      POSTGRES_DB: percepta_test
    # tmpfs rather than a volume: nothing here outlives the run, and not
    # touching the disk makes the suite noticeably faster.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U percepta -d percepta_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  # The app's background workers connect to Redis at import time and retry for
  # ever when it is absent, so without this every test carried three tracebacks
  # in its captured log — the realtime hub, the station ingest and the power
  # recorder, all failing at localhost:6379. None of it affected a result, and
  # all of it buried the assertion that did.
  redis-test:
    image: redis:7-alpine
    profiles: ["tests"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: app/Dockerfile
      # The test stage, which is the runtime image plus pytest. Naming it here
      # is what keeps it out of the image a server runs.
      target: tests
    # The source from the host, so a run reflects what is checked out rather
    # than what was last built into an image.
    volumes:
      - ./app/backend:/app/backend
      - ./app/tests:/app/tests
    environment:
      POSTGRES_HOST: postgres-test
      POSTGRES_DB: percepta_test
      POSTGRES_USER: percepta
      POSTGRES_PASSWORD: test
      # Deliberately no APP_DB_PASSWORD. Without one the app engine is the
      # schema owner, which bypasses row-level security — these tests are about
      # endpoint behaviour, and tenant isolation has its own verifier in
      # backend/scripts/verify_rls.py.
      REDIS_URL: redis://redis-test:6379/0
      SECRET_KEY: testing-only-not-a-real-key
      PYTHONDONTWRITEBYTECODE: "1"
      # No cache directory. /app belongs to root in the image and the tests run
      # as uid 10001, so pytest's cache writes fail — three warnings a run about
      # something nothing here wants anyway.
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  tile_cache:
  registry_data:
