# Registry storage on Cloudflare R2 (or any S3-compatible object store), so the
# platform box holds NO registry state — the sane shape for a future cloud move
# (server/docs/07-remote-update-distribution.md). Overlay it on the base file:
#
#   docker compose -f docker-compose.yaml -f docker-compose.r2.yaml up -d registry
#
# Fill the REGISTRY_S3_* values in .env first. The `:?` guards refuse to start if
# any is unset, so a half-configured registry fails loudly rather than silently
# falling back to local disk. Nothing here names a bucket, endpoint or key —
# it is all configuration.
services:
  registry:
    volumes:
      # The S3 storage config replaces the image default; certs stay for the
      # token rootcertbundle. No registry_data volume — storage is the bucket.
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
      - ./certs:/certs:ro
    environment:
      REGISTRY_STORAGE_S3_REGION:         "${REGISTRY_S3_REGION:-auto}"
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "${REGISTRY_S3_ENDPOINT:?set REGISTRY_S3_ENDPOINT (https://<account>.r2.cloudflarestorage.com)}"
      REGISTRY_STORAGE_S3_BUCKET:         "${REGISTRY_S3_BUCKET:?set REGISTRY_S3_BUCKET}"
      REGISTRY_STORAGE_S3_ACCESSKEY:      "${REGISTRY_S3_ACCESS_KEY:?set REGISTRY_S3_ACCESS_KEY}"
      REGISTRY_STORAGE_S3_SECRETKEY:      "${REGISTRY_S3_SECRET_KEY:?set REGISTRY_S3_SECRET_KEY}"
      # R2 wants path-style addressing and SigV4 (registry's default).
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_DELETE_ENABLED:    "true"
      # false = the registry 302s blob GETs to a presigned R2 URL, so a station
      # downloads straight from R2 and the bytes never cross the tunnel. Set true
      # to stream everything through this box instead.
      REGISTRY_STORAGE_REDIRECT_DISABLE:  "${REGISTRY_S3_REDIRECT_DISABLE:-false}"
