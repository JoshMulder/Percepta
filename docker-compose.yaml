# Pinned so volumes are found under a stable name even if the checkout
# directory is renamed - same reasoning as DroneOps.
name: percepta

services:
  postgres:
    image: postgres:17
    container_name: percepta-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately not published. Reach it through the app container, or
    # temporarily uncomment for local inspection.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: percepta-redis
    restart: unless-stopped
    # What Redis holds here is all reconstructible: control leases (a lost lease
    # is re-acquired), revocation pushes (the 60s revalidation poll is the
    # backstop), single-use stream ticket ids (they expire in 60s anyway) and
    # live fan-out. None of it survives a restart usefully, so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No published ports: compose network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: percepta-app
    restart: unless-stopped
    env_file:
      - .env
    command: python -m backend.scripts.start_app
    volumes:
      - ./app:/app
    ports:
      # In production bind to loopback and let a reverse proxy terminate TLS:
      #   "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
      - "${APP_HOST_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
