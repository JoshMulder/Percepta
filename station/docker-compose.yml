# The ground station agent, as a container. **This is the deployment path.**
#
#   cd station
#   ./bootstrap.sh          # writes .env, then brings it up
#
# This file and `.env` sit at the top of `station/` rather than in `deploy/`,
# beside the package they run. Everything a person types lives here; `deploy/`
# holds the things nobody types — the Dockerfile, the udev rule, the reference
# inventory.
#
# Two update paths now (DECISIONS.md item 48), chosen by GSU_IMAGE_REF in .env:
# a local `docker compose up -d --build` from this checkout, or — deployed — a
# signed image pulled from a registry by the host-side updater
# (deploy/gsu-update.sh, installed by deploy/install-updater.sh). The old "no
# updater daemon, no registry" note is superseded.
#
# ---------------------------------------------------------------------------
# DEVICE ACCESS IS DELIBERATELY BROAD, AND THAT IS A DECISION
#
# The container gets the host's whole /dev and a cgroup rule for every device
# major it might need — not a list of specific nodes. **This is on the owner's
# instruction**, who said isolation is not a goal here because nothing else
# runs on this box, and that the station must be easy to stand up, maintain and
# debug given that it will be hard to reach physically.
#
# It buys the two things a narrow mapping cannot:
#
#   * **A missing device no longer stops the station.** With named `devices:`
#     entries, Docker refuses to start a container whose mapped node is absent
#     — so one USB adapter failing to enumerate at boot took the whole station
#     down. Now it starts, and reports the missing sensor as a health
#     condition exactly as the systemd path does.
#   * **Hot-replug works.** A UART or the SDR re-enumerating gets a new node,
#     which appears through the bind mount and is permitted by the cgroup rule.
#     The agent's 30-second rediscovery loop then picks it up with nobody
#     touching anything.
#
# What it costs: the container can reach every device on the box, including
# ones fitted later. Accepted, and written down in DECISIONS.md item 35c rather
# than apologised for in a comment.
#
# `privileged: true` is still NOT used, and not for isolation's sake: it also
# changes cgroup, apparmor and /sys handling, which is a blunter instrument
# than needed and one more thing to reason about when something misbehaves.
#
# Find the numeric group ids for `group_add` on the host with:
#   getent group dialout plugdev
# The names cannot be used here — they resolve inside the container, where the
# ids differ from the host's.
# ---------------------------------------------------------------------------

name: percepta-station

services:
  gsu:
    build:
      # `station/` either way — this file used to sit one level down and reach
      # up for it. The package, the requirements and .dockerignore are all
      # here, which is what the image is built from.
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Set GSU_TRANSCRIBE=0 in .env to build a station without the on-box
        # transcription tooling (whisper.cpp + the model ladder) — a much smaller
        # image and a far shorter build on a constrained box, at the cost of no
        # airband transcription. Default on.
        GSU_TRANSCRIBE: ${GSU_TRANSCRIBE:-1}

    # Chosen by GSU_IMAGE_REF in .env (item 48):
    #   * Set to a signed registry digest — ghcr.io/<owner>/percepta-gsu@sha256:… —
    #     is the deployed path. The host-side updater pulls and verifies it,
    #     rewrites this key and recreates; `build:` above goes unused.
    #   * Unset is the local path: `docker compose up --build` builds from this
    #     checkout and tags it percepta/gsu:local, exactly as before.
    image: ${GSU_IMAGE_REF:-percepta/gsu:local}
    # No pull_policy on purpose. With a `build:` section present, compose treats
    # this name as the build *output* — it builds the image when absent and never
    # reaches for a registry, which is what both paths want. The local path builds
    # percepta/gsu:local from this checkout; the deployed path has the updater pull
    # and verify the signed digest itself (deploy/gsu-update.sh) before recreating
    # with `--no-build`, so compose still has nothing to fetch. An explicit
    # `pull_policy: missing` was tried and backfired: it made a fresh local build
    # first try to *pull* percepta/gsu:local from Docker Hub and print "pull access
    # denied ... repository does not exist" before falling through to the build.
    container_name: percepta-gsu

    # Restart for ever. Same reasoning as the systemd unit: on a site hours
    # away, the right behaviour for a crash loop is to keep trying and keep
    # saying so, not to give up. `unless-stopped` also survives a host reboot,
    # which `on-failure` does not.
    restart: unless-stopped

    # The radio is stopped through its own shutdown path, never killed — a
    # dongle killed mid-transfer needs a physical replug, and here that is a
    # truck (server/docs/05-radio-integration.md). Docker's default grace is
    # 10s, which is not enough; this matches TimeoutStopSec in the unit file.
    stop_grace_period: 45s
    # Reaps zombies and forwards signals. The agent installs its own SIGTERM
    # handler, so this is belt and braces rather than load-bearing.
    init: true

    # Beside this file, and gitignored, so that `git pull` cannot clobber a
    # site's settings and a secret never reaches the repository. `bootstrap.sh`
    # writes it; `deploy/gsu.env.example` documents every key.
    #
    # Compose treats a missing env file as a hard error rather than an empty
    # one, so bootstrap creates it before its first `docker compose` call - see
    # the comment there.
    env_file:
      - .env
    environment:
      # Overridden here rather than in the env file: inside the container the
      # state directory is always this path, whatever the host maps to it.
      GSU_HOME: /var/lib/percepta-gsu
      # GSU_CA_FILE is deliberately NOT set here, and setting it would break
      # the normal enrolment flow — this file used to, and the first real Pi
      # paid for it. The broker CA normally *arrives in the enrolment
      # response* and is persisted at $GSU_HOME/broker-ca.pem, which is on the
      # writable state volume. Pointing GSU_CA_FILE somewhere else names a
      # file that exists only if somebody pre-provisioned it — and a
      # set-but-unreadable GSU_CA_FILE is a hard
      # refusal, never a fallback (gsu/tls.py), so an un-pre-provisioned
      # station could not build broker trust at all, and a pre-provisioned one
      # could never be superseded by enrolment. Pre-provisioning is opt-in:
      # set GSU_CA_FILE in .env and mount the file in.
      # The console must be reachable from outside the container to be
      # reachable at all, so it binds 0.0.0.0 *inside*. What the host exposes
      # is decided by `ports:` below, and the agent refuses to serve the page
      # at all without a password hash — so the password, not the interface,
      # is what protects it.
      GSU_SETUP_HOST: 0.0.0.0
      # Where the agent writes a system.update request for the host-side updater
      # — the container path of the handoff bind mount below. The host side is
      # watched by gsu-update.path (item 48).
      GSU_UPDATE_DIR: /var/lib/percepta-gsu-update
      # Where the agent writes a host.open request for the privileged host-shell
      # helper — the container path of the shared handoff volume below. Only used
      # when GSU_HOST_SHELL is set in .env (opt-in) AND the `hostshell` profile is
      # up; the agent writes the request either way, and nothing reads it unless
      # the helper container exists.
      GSU_HOST_SHELL_DIR: /var/lib/percepta-gsu-hostshell

    volumes:
      # State: credential, pinned broker CA, device inventory, events,
      # recordings. A named volume rather than a host path: nothing outside the container
      # needs to read it, and the credential inside it is rotated by the
      # station itself. It deliberately does NOT come from the environment —
      # renewal writes a new secret, an environment variable cannot be written
      # back to, and a station whose credential lives in one silently stops
      # renewing and dies at expiry.
      - gsu-state:/var/lib/percepta-gsu
      # Read-only, and empty on most boxes. It exists for one case: a platform
      # behind a private CA, where the station has to be given that root
      # *before* it can verify anything — including the enrolment call that
      # would otherwise deliver it. That is the bootstrap problem, and there is
      # no way round it except putting the certificate on the box by hand.
      #
      # Opt in by setting GSU_CA_FILE=/etc/percepta/ca.crt in .env. Leave it
      # unset for a platform behind a publicly trusted certificate, where the
      # system trust store is the right answer and pinning would only mean a
      # site visit whenever the certificate is renewed.
      #
      # The mount is unconditional because a missing bind source is a container
      # that will not start, and a station that will not start over a directory
      # it was never going to read is the worse failure.
      - /etc/percepta:/etc/percepta:ro
      # The host's whole /dev, so that device nodes appear and disappear inside
      # the container exactly as they do outside it.
      #
      # It has to be all of /dev rather than just /dev/serial and /dev/bus/usb,
      # because /dev/serial/by-id holds *relative symlinks* — `../../ttyUSB0` —
      # which resolve against the container's own /dev. Mounting the symlink
      # directory without the nodes it points at gives you stable names that
      # resolve to nothing.
      #
      # Not read-only: opening a serial port is O_RDWR.
      - /dev:/dev
      # How the agent finds out what is disciplining the clock. Without this it
      # cannot find out at all: `/run` inside a container is the container's own
      # tmpfs, so timesyncd's flag file is invisible, and neither `chronyc` nor
      # `timedatectl` is in the image — every probe in gsu/clock.py returns "no
      # idea". On a box with a hardware RTC that unknown used to be worded as
      # "a hardware RTC, not synced", which is a claim the station had no basis
      # for: the container shares the host's clock, and on the Pi 5 that clock
      # was correctly synchronised the whole time.
      #
      # The directory, not the flag file inside it: the file does not exist
      # until the first sync, and Docker would create a *directory* in its place
      # to satisfy the mount — after which timesyncd could never write the file
      # and the station would report "running but not synchronised" for ever.
      # Read-only because the agent reads the clock and never sets it, which is
      # the same line ProtectClock=yes draws on the systemd path.
      - /run/systemd/timesync:/run/systemd/timesync:ro
      # The update handoff (item 48): the agent writes an update request here and
      # the updater container reads it and writes its status back. A named volume
      # shared between the two containers — no host directory, no ownership dance:
      # the image creates this path owned by the agent's uid, so a fresh volume
      # inherits it. Both are containers, so nothing reaches into Docker's volume
      # path from the host (which is what item 48 cautioned against).
      - gsu-update:/var/lib/percepta-gsu-update
      # The host-shell handoff: the agent writes a host.open request here and the
      # privileged helper reads it. Written whether or not the helper is running;
      # a box that has not brought up the `hostshell` profile simply has nothing
      # reading it, which is one of the two gates on this feature.
      - gsu-hostshell:/var/lib/percepta-gsu-hostshell

    # Visibility is not permission — the device cgroup still has to allow each
    # major, or every open() returns EPERM against a node that is plainly
    # there. One rule per major this station can use, including the two whose
    # drivers do not exist yet, so that fitting them later is not also a
    # container change:
    #
    #   188  USB serial adapters (ttyUSB*) — Airmar, ping RX Pro
    #   166  USB CDC-ACM (ttyACM*) — some GPS receivers enumerate here
    #   204  on-chip serial (ttyAMA*) — the Pi's own GPIO-header UART
    #   189  USB raw (/dev/bus/usb/*) — libusb, so the RTL-SDR
    #   249  pps (pps*) — the GPS pulse-per-second line, when it arrives
    #
    # 81 (video4linux) was here for the CSI camera and went with it. A network
    # camera is a URL and needs no device node at all.
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'
      - 'c 204:* rmw'
      - 'c 189:* rmw'
      - 'c 249:* rmw'

    # The setup page, on the site LAN, on port 80.
    #
    # **The password is the control, not the interface.** The agent refuses to
    # serve this page at all without GSU_SETUP_PASSWORD_HASH — it demotes itself
    # to the container's own loopback, which this mapping cannot reach — and
    # `bootstrap.sh` will not finish without collecting one. So "reachable only
    # from a shell on the box" was not buying protection on top of that; it was
    # costing an installer standing at the enclosure the ability to open the
    # page at all, which is the job the page exists for.
    #
    # Port 80 rather than 443: the console speaks plain HTTP
    # (`http.server.ThreadingHTTPServer`, no TLS anywhere in gsu/console.py).
    # Publishing it on 443 would answer HTTP on the port every browser tries
    # HTTPS on first, so `https://<box>` would fail outright and an installer
    # would have to know to type `http://<box>:443`. Worse in every way than 80
    # until somebody gives the console a certificate.
    #
    # **What this means on the wire:** the password and the enrolment code cross
    # the site LAN in clear text. That is the trade, and it is why the other
    # three controls in gsu/setup_access.py matter — the window that closes, the
    # source-address check, and CSRF on every form.
    #
    # Set GSU_SETUP_BIND=127.0.0.1 in .env to put it back on loopback (reach it
    # with `ssh -L 80:127.0.0.1:80`), or GSU_SETUP_HOST_PORT to move it off 80
    # if something else on the box wants that port. Prefer binding to the setup
    # interface's own address over 0.0.0.0 where the address is known.
    #
    # Binding a port below 1024 needs no privilege here: the container process
    # is unprivileged and still listens on 8088: it is the Docker daemon that
    # publishes 80 on the host.
    ports:
      - "${GSU_SETUP_BIND:-0.0.0.0}:${GSU_SETUP_HOST_PORT:-80}:8088"

    # Numeric because the container's /etc/group is the image's and the host's
    # is the host's, and only the numbers are shared. Check with
    # `getent group dialout plugdev` on the host and correct these if they
    # differ. 20/46 are the Debian defaults.
    #   20 dialout — the USB-UARTs
    #   46 plugdev — the SDR
    group_add:
      - "20"
      - "46"

    # --- hardening, matched as closely as it can be to the systemd unit ------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's filesystem is immutable at runtime; the only writable paths
    # are the state bind mount and a tmpfs. Equivalent to ProtectSystem=strict.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    # A fence, not a target. The agent's own footprint is a fraction of this, but
    # on-box transcription is not: whisper-cli runs as a child of the agent, in
    # this same cgroup, and small.en at q8_0 needs ~650 MB while it decodes (264 MB
    # model + ~235 MB kv/compute buffers + the agent). The old 384 MB — sized for
    # the agent alone — could not hold that, so a board that enforces the memory
    # cgroup would OOM-kill the container the moment it benchmarks the model. (The
    # field Pi 5 does NOT enforce it — its kernel ships cgroup memory off — which is
    # the only reason 384 MB ever "worked" even with the f16 model; do not rely on
    # that.) 768 MB fits it with headroom and still fences a leak well below the
    # Pi 5's 8 GB. A box built GSU_TRANSCRIBE=0 never loads a model and sits far
    # under this.
    mem_limit: 768m
    pids_limit: 64

    # --- logs, which are what fills an SD card -------------------------------
    # Docker's default json-file driver has NO rotation. On a station that logs
    # a line per health condition for months, an unrotated container log will
    # eventually fill the disk and take the site down — a slow, silent failure
    # with a very annoying cause. 10 MB × 3 is about a fortnight here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The host-side updater, as a sibling container (item 48). Built locally and
  # trusted; it pulls, verifies and recreates the AGENT — never itself. It holds
  # the docker socket, which is root-equivalent on the host: that is the deal for
  # keeping the host Docker-only, and it is one small container whose only job is
  # updates. Behind the `updater` profile, so a box that updates by hand
  # (`docker compose up -d`) runs nothing extra; opt in with
  # `docker compose --profile updater up -d`.
  updater:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: deploy/updater.Dockerfile
    image: percepta/gsu-updater:local
    container_name: percepta-updater
    restart: unless-stopped
    init: true
    environment:
      GSU_IMAGE: ${GSU_IMAGE:-registry.percepta.nz/percepta-gsu}
      GSU_COMPOSE_DIR: /workspace
      GSU_ENV_FILE: /workspace/.env
      GSU_UPDATE_HANDOFF: /handoff
      GSU_UPDATE_STATE: /var/lib/updater
      GSU_AGENT_CONTAINER: percepta-gsu
      GSU_AGENT_SERVICE: gsu
      # Neither the signing keys nor the registry credential are configured here.
      # The agent writes both into the shared handoff at enrolment and every
      # renewal — signing-keys/*.pub and registry-credential.json — and
      # gsu-update.sh reads them there (a private-key cosign verify against the
      # pinned keys, and a docker login with the station's own bearer secret).
      # So nothing update-specific lives in this service's env, and a key rotation
      # or a credential refresh lands with no compose change. The old keyless
      # cosign identity/issuer and a static pull token are gone with that design.
      GSU_UPDATE_GATE_S: ${GSU_UPDATE_GATE_S:-180}
      GSU_UPDATE_POLL_S: ${GSU_UPDATE_POLL_S:-30}
    volumes:
      # The docker socket: how it recreates the agent. Root-equivalent on the
      # host, accepted for this one container (see the note above).
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose file and .env, read-write: the updater rewrites GSU_IMAGE_REF
      # and runs `docker compose up -d gsu` from here.
      - .:/workspace
      # The shared handoff volume: reads the agent's request, writes status back.
      - gsu-update:/handoff
      # Updater-only bookkeeping: rejected digests and the rollback ref.
      - updater-state:/var/lib/updater
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The host-shell helper — the second half of "a platform admin reaches a
  # station" (the first is the agent's console proxy, which needs no elevated
  # container). This one does: it opens a shell on the HOST, which the sandboxed
  # agent cannot and must not. It is the biggest trust escalation in the station,
  # so it is fenced accordingly:
  #
  #   * Behind the `hostshell` profile, so it does not exist unless a box opts in
  #     with `docker compose --profile hostshell up -d`. That is one of two gates;
  #     the other is GSU_HOST_SHELL in .env, without which the agent refuses to
  #     write this helper any request at all (gsu/transport/host_shell.py).
  #   * It talks to nobody on its own. The agent writes a time-boxed request into
  #     the shared handoff (only when a platform admin asks, over an audited,
  #     platform-admin-only path), and this dials OUT to /host/ingest to serve it.
  #   * It holds nothing else — no docker socket, no state, no listening port.
  #
  # It needs elevated privilege, but NOT `privileged: true`. Opening a *host*
  # shell means `nsenter` into the host's init (PID 1), and that takes two caps
  # and only two: CAP_SYS_PTRACE to open PID 1's namespace links under
  # /proc/1/ns (the read is gated by ptrace_may_access, which for PID 1 needs the
  # cap), and CAP_SYS_ADMIN to `setns` into them. Plus `pid: host` so PID 1 is
  # visible at all. So that is all it is granted — not the ~40 caps, blanket
  # device access and unmasked /proc `privileged` would also hand it.
  #
  # No seccomp override: docker-default already permits `setns` — and
  # `syslog(2)`, so `dmesg` — once CAP_SYS_ADMIN is held. Verified on the field
  # Pi 5 (aarch64): the narrowed form opens a host shell under the stock seccomp
  # profile. AppArmor IS lifted, because docker-default forbids the /sys writes a
  # host shell makes (a USB unbind/bind), which nsenter into the host mount
  # namespace does not otherwise escape.
  #
  # History worth keeping: 5bec14e first narrowed this to CAP_SYS_ADMIN alone,
  # which failed on the Pi 5 with `nsenter: reassociate to namespaces failed:
  # Operation not permitted`. The reflex was to blame seccomp on `setns` — wrong.
  # nsenter never reached `setns`: it could not even read /proc/1/ns/*, because
  # CAP_SYS_PTRACE was missing. `privileged` had hidden that by granting every
  # capability. Adding CAP_SYS_PTRACE, not a seccomp lift, is what fixed it.
  #
  # This is narrower than `privileged` on the helper itself — no other
  # capabilities, no blanket device-cgroup access, a masked /proc — but it is NOT
  # a boundary against the shell it opens: once nsenter lands in the host
  # mount+pid namespaces that session is host root, which is the whole point. The
  # narrowing only shrinks what the helper holds BEFORE it nsenters, should the
  # bridge ever be exploited pre-nsenter. The real fences are the two gates above
  # (the off-by-default profile and GSU_HOST_SHELL), not the capability set.
  hostshell:
    profiles: ["hostshell"]
    build:
      context: .
      dockerfile: deploy/hostshell.Dockerfile
    image: percepta/gsu-hostshell:local
    container_name: percepta-hostshell
    restart: unless-stopped
    init: true
    # See host_ingest_url derivation and the credential in the handoff — nothing
    # platform-specific is configured here, exactly like the updater.
    pid: host
    # See the note above: `nsenter` into host PID 1 needs CAP_SYS_PTRACE (to open
    # /proc/1/ns/*) and CAP_SYS_ADMIN (to `setns` into them), plus AppArmor
    # lifted for the /sys writes a host shell makes. Default seccomp is fine. Not
    # `privileged: true`. `no-new-privileges` is deliberately absent — the host
    # shell must run setuid host tools (sudo, mount) after nsenter.
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      GSU_HOST_SHELL_DIR: /handoff
    volumes:
      # The handoff, read-only: it only ever reads the agent's request. The agent
      # is the sole writer.
      - gsu-hostshell:/handoff:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gsu-state:
  updater-state:
  # The agent<->updater handoff (item 48): the request and the status file.
  gsu-update:
  # The agent->hostshell handoff: the host.open request the helper acts on.
  gsu-hostshell:
