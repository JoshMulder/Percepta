# Reboot on panic instead of hanging forever.
#
# The default on Raspberry Pi OS is kernel.panic=0, which means a panicked kernel
# sits dead until somebody physically power-cycles it. On a station on a hill
# that is the difference between a 10-second gap and a site visit.
#
# The hardware watchdog covers this too - it was tested on the field Pi 5 on
# 2026-08-14 and brought a deliberately panicked board back in 25 seconds - but
# this is the cleaner path: a kernel-initiated reboot rather than a hardware
# reset of a wedged SoC, and it does not depend on that reset leaving the board
# in a state that can boot.
#
# panic_on_oops promotes an oops to a panic. An oops leaves the kernel in an
# undefined state with some thread dead; on an unattended box, rebooting beats
# limping on in a way nobody is watching.
kernel.panic = 10
kernel.panic_on_oops = 1
