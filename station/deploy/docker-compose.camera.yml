# Overrides for a container station with a CSI camera. Not optional if you
# take the container path with a camera fitted — and **run on real hardware**:
# on the first real Pi (2B, Trixie, ov5647) these constraints were each
# necessary and together sufficient for the sensor to enumerate and picamera2
# to capture snapshots inside the container. What still fails in the container
# is the live encoder, for reasons that are the image's, not this file's — see
# Dockerfile.camera, DEPLOYMENT.md §3. Camera stations run systemd.
#
#   sudo docker compose -f deploy/docker-compose.yml \
#                       -f deploy/docker-compose.camera.yml up -d
#
# Three things the base compose file does not do, each of which fails as "no
# cameras available" — the same message an unplugged ribbon gives:
#
# 1. **udev.** libcamera enumerates media devices through udev. With no
#    /run/udev in the container it finds nothing, however many device nodes are
#    mounted. Read-only: the station has no business writing udev state.
#
# 2. **The device cgroup.** The base file allows specific majors, and the two
#    that matter for a camera cannot be written down in advance:
#
#      /dev/video*      major 81, static and documented — already allowed
#      /dev/media*      **dynamically allocated**, kernel-specific
#      /dev/dma_heap/*  **dynamically allocated**, kernel-specific
#
#    Dynamic majors are handed out at boot from the top of the range. On the
#    machine this was written on, every dynamically registered driver landed
#    between 240 and 254 — including `pps` at 246, which the base file guesses
#    at 249. That guess is worth checking too.
#
#    So this file allows **all character devices**, and that is a deliberate
#    widening rather than an oversight: the alternative is a rule set that is
#    correct until the next kernel update and then silently is not, on a box
#    nobody can reach. The container already has the host's whole /dev mounted
#    (DECISIONS.md item 35c), so this grants permission over nodes it can
#    already see rather than exposing anything new.
#
#    **To narrow it back**, on the box, with the camera connected:
#
#      ls -l /dev/video* /dev/media* /dev/dma_heap/*
#      # the first of the two numbers on each line is the major
#
#    then replace the rule below with one line per major.
#
# 3. **The image.** The slim image has no libcamera at all, so the camera is
#    correctly reported as unavailable and there is no picture. Build
#    Dockerfile.camera with SUITE matching the host's Debian release.

services:
  gsu:
    image: percepta/gsu-camera:current

    volumes:
      - /run/udev:/run/udev:ro

    device_cgroup_rules:
      # See (2) above. Every character device, because the ones a camera needs
      # have kernel-specific majors and a wrong number is indistinguishable
      # from absent hardware.
      - 'c *:* rmw'

    group_add:
      # 44 video and 46 plugdev come from the base file. `render` is added here
      # because libcamera's ISP work goes through a render node on some stacks,
      # and it is 993 on Raspberry Pi OS rather than a Debian default — check
      # with `getent group render video` on the box and correct it.
      - "993"
