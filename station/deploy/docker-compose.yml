# The ground station agent, as a container.
#
#   cd /opt/percepta/station
#   docker compose -f deploy/docker-compose.yml up -d
#
# This is the container half of DEPLOYMENT.md §16. The systemd unit beside it is
# the other, and the tradeoff is written down in DECISIONS.md item 35 rather
# than implied by which one exists.
#
# ---------------------------------------------------------------------------
# THE PART THAT NEEDS EDITING BEFORE THIS WILL START
#
# `devices:` below names specific device nodes. **Docker refuses to start a
# container whose mapped device does not exist**, so this file has to match the
# box: comment out what is not fitted, and add what is. That is the single
# biggest ergonomic difference from the systemd path, where a missing device is
# a health condition the station reports and recovers from on its own.
#
# Find the numeric group ids for `group_add` on the host with:
#   getent group dialout plugdev video
# The names cannot be used here — they resolve inside the container, where the
# ids differ from the host's.
# ---------------------------------------------------------------------------

name: percepta-station

services:
  gsu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: percepta/gsu:0.1.0
    container_name: percepta-gsu

    # Restart for ever. Same reasoning as the systemd unit: on a site hours
    # away, the right behaviour for a crash loop is to keep trying and keep
    # saying so, not to give up. `unless-stopped` also survives a host reboot,
    # which `on-failure` does not.
    restart: unless-stopped

    # The radio is stopped through its own shutdown path, never killed — a
    # dongle killed mid-transfer needs a physical replug, and here that is a
    # truck (server/docs/05-radio-integration.md). Docker's default grace is
    # 10s, which is not enough; this matches TimeoutStopSec in the unit file.
    stop_grace_period: 45s
    # Reaps zombies and forwards signals. The agent installs its own SIGTERM
    # handler, so this is belt and braces rather than load-bearing.
    init: true

    env_file:
      - /etc/percepta/gsu.env
    environment:
      # Overridden here rather than in the env file: inside the container the
      # state directory is always this path, whatever the host maps to it.
      GSU_HOME: /var/lib/percepta-gsu
      GSU_CA_FILE: /etc/percepta/broker-ca.pem
      # The console must be reachable from outside the container to be reachable
      # at all, so it binds 0.0.0.0 *inside* and is published to loopback only
      # by `ports:` below. The container's network namespace is the boundary.
      GSU_SETUP_HOST: 0.0.0.0

    volumes:
      # State: credential, pinned broker CA, device inventory, events,
      # recordings. A bind mount rather than a named volume so that the files
      # are in the same place as on the systemd path — `ls /var/lib/percepta-gsu`
      # works whichever way the station was deployed, which matters at 2am.
      - /var/lib/percepta-gsu:/var/lib/percepta-gsu
      - /etc/percepta:/etc/percepta:ro
      # The stable serial names. This is a directory of symlinks pointing at
      # ../../ttyUSB0 and friends, so it only works in combination with the
      # `devices:` entries below — the symlink resolves inside the container to
      # a node that has to be mapped. Mapped read-only: the station reads these
      # names, it never creates them.
      - /dev/serial/by-id:/dev/serial/by-id:ro

    devices:
      # --- the two USB-UARTs -------------------------------------------------
      # Both are mapped by their kernel names because that is what the by-id
      # symlinks point at. Which physical instrument is on which node still does
      # not matter — the station is configured with the by-id path and resolves
      # it — but BOTH nodes have to exist here or the container will not start.
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1

      # --- the Pi camera -----------------------------------------------------
      # Commented out because there is no camera driver in this build, so
      # mapping it would grant access to a device nothing opens. Uncomment with
      # the driver. On Bookworm the camera is libcamera/V4L2, which needs more
      # than one node: /dev/video0, /dev/media0 and /dev/dma_heap/*. Untested.
      # - /dev/video0:/dev/video0
      # - /dev/media0:/dev/media0

    # --- the SDR ------------------------------------------------------------
    # libusb needs /dev/bus/usb/<bus>/<device>, and the <device> number changes
    # every time the dongle re-enumerates — so a `devices:` entry for today's
    # node stops working after a replug, and the container would have to be
    # recreated to see the new one. The whole USB bus is mapped instead, with a
    # cgroup rule for the USB device major (189).
    #
    # This is broader than one dongle and it is the honest cost of the container
    # path: the systemd unit's `DeviceAllow=char-usb_device` is the same breadth,
    # but there it is one line in a file describing a sandbox, and here it has to
    # be traded against the alternative of a station that silently loses its
    # receiver after somebody unplugs it.
    #
    # No driver in this build, so it is commented out. Uncomment with the driver.
    # volumes: - /dev/bus/usb:/dev/bus/usb
    # device_cgroup_rules: - 'c 189:* rmw'

    # The console is published to loopback only. It has no authentication —
    # physical presence, or an SSH tunnel, is the control — and publishing it on
    # 0.0.0.0 would put an unauthenticated setup page on the public internet.
    ports:
      - "127.0.0.1:8088:8088"

    # Numeric because the container's /etc/group is Debian's and the host's is
    # the Pi's, and only the numbers are shared. Check with
    # `getent group dialout plugdev video` on the host and correct these.
    #   20 dialout — the USB-UARTs
    #   46 plugdev — the SDR
    #   44 video   — the camera
    # (20/44/46 are the Debian defaults, which Raspberry Pi OS inherits.)
    group_add:
      - "20"
      - "46"
      - "44"

    # --- hardening, matched as closely as it can be to the systemd unit ------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's filesystem is immutable at runtime; the only writable paths
    # are the state bind mount and a tmpfs. Equivalent to ProtectSystem=strict.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    # A fence, not a target. The agent's own footprint is a fraction of this;
    # the limit exists so that a leak takes out the agent rather than the box.
    mem_limit: 384m
    pids_limit: 64

    # --- logs, which are what fills an SD card -------------------------------
    # Docker's default json-file driver has NO rotation. On a station that logs
    # a line per health condition for months, an unrotated container log will
    # eventually fill the card and take the site down — a slow, silent failure
    # with a very annoying cause. 10 MB × 3 is about a fortnight here.
    #
    # The systemd path does not need this: journald has rotation and disk limits
    # configured out of the box.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
