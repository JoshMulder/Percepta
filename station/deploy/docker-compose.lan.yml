# Publishes the setup page on the LAN instead of loopback-only.
#
# An OVERLAY, off by default, because the base file's 127.0.0.1 binding is the
# right answer for a field station and the wrong one for a bench: UI work
# against a box on the desk should not need an SSH tunnel per page load. The
# page still requires GSU_SETUP_PASSWORD_HASH - without one the agent demotes
# itself to loopback inside the container and this mapping publishes a socket
# that answers nothing useful.
#
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
#
# On a bench box, set it once instead of remembering it every time. An overlay
# you have to name on each invocation is one a later `docker compose up -d`
# silently drops — the container comes back bound to loopback, the setup page
# stops answering on the LAN, and nothing anywhere says why. Compose reads a
# `.env` beside this file automatically, so:
#
#   printf 'COMPOSE_FILE=docker-compose.yml:docker-compose.lan.yml\n' \
#     | sudo tee /opt/percepta/station/deploy/.env
#
# after which plain `docker compose up -d` and `restart` keep the override.
# Deliberately not shipped and not written by install.sh: publishing the setup
# page on the LAN is a bench decision, and it should be made on the bench.
services:
  gsu:
    ports: !override
      - "8088:8088"
