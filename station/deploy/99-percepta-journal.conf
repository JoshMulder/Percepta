# Keep the journal across reboots.
#
# NOTE THE 99. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf setting
# Storage=volatile, deliberately, to spare the SD card. systemd sorts drop-ins by
# FILENAME across every drop-in directory, so a 10- file in /etc still loses to
# the vendor's 40- in /usr. This has to sort after it.
#
# Overriding a deliberate wear decision, so it is capped: an unattended station
# that starts logging hard must not fill its own card. 200 MB is weeks of a quiet
# box, and the health sampler's line-a-minute is about 3 MB a month.
#
# Why at all: a station that dies overnight and is revived by a power cycle takes
# every trace of why with it if the journal lives in RAM. That is not
# hypothetical - it happened twice in August 2026 before this existed.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
